/* ── SAVE ──────────────────────────────────── */
let coins=0,highScore=0,selectedSkin=0,checkpointLevel=0;
const unlockedSkins=new Set([0]);
function loadSave(){try{const d=JSON.parse(localStorage.getItem('gq20')||'{}');coins=d.c||0;highScore=d.h||0;selectedSkin=d.s||0;checkpointLevel=d.cp||0;(d.u||[0]).forEach(i=>unlockedSkins.add(i));}catch(e){}}
function doSave(){try{localStorage.setItem('gq20',JSON.stringify({c:coins,h:highScore,s:selectedSkin,cp:checkpointLevel,u:[...unlockedSkins]}));}catch(e){}}
loadSave();

/* ── GAME STATE ────────────────────────────── */
const ST={MENU:0,INTRO:1,PLAYING:2,LVLDONE:3,GAMEOVER:4,WIN:5,SHOP:6,PAUSED:7};
let state=ST.MENU,currentLevel=0;
let score=0,totalScore=0,lives=3,gameTime=0,stateTimer=0;
let platforms=[],gems=[],powerGems=[],enemies=[],particles=[];
let boss=null,player={},ridingPlatform=null,powerUpTimer=0;
let flashMsg='',flashTimer=0,shopCursor=0,coinEarned=0,cpBanner=0,cpNum=0,goHighlight=0,lifeGainBanner=0;
const PW=27,PH=33;

/* ── CHECKPOINT LOGIC ──────────────────────── */
function checkCheckpoints(n){
  const cps=[4,9,14]; // 0-indexed = levels 5,10,15
  for(const cp of cps){
    if(n===cp&&checkpointLevel<cp+1){
      checkpointLevel=cp+1;
      cpNum=cps.indexOf(cp)+1;
      cpBanner=4.5;
      doSave();
    }
  }
}
function bestCheckpointLevel(){
  if(checkpointLevel>=15)return 14;
  if(checkpointLevel>=10)return 9;
  if(checkpointLevel>=5)return 4;
  return -1;
}

/* ── LOAD LEVEL ────────────────────────────── */
function loadLevel(n){
  currentLevel=n;powerUpTimer=0;flashMsg='';flashTimer=0;particles=[];
  const d=LEVELS[n],th=THEMES[d.tier];
  checkCheckpoints(n);
  platforms=d.platforms.map((p,i)=>({...p,moving:!!(p.vx||p.vy),minX:p.minX!=null?p.minX:p.x,maxX:p.maxX!=null?p.maxX:p.x+(p.vx?300:0),minY:p.minY!=null?p.minY:p.y,maxY:p.maxY!=null?p.maxY:p.y+(p.vy?150:0),col:i===0?th.groundCol:th.platCol,top:i===0?th.groundTop:th.platTop}));
  const rb=['#ff4d6a','#ffa040','#40e080','#40d4f5','#c5a0ff','#ffd700','#ff70b0','#80deea'];
  gems=d.gems.map((g,i)=>({x:g.x,y:g.y,col:d.gemCol==='#RAINBOW'?rb[i%rb.length]:d.gemCol,collected:false,t:Math.random()*Math.PI*2}));
  powerGems=d.pgems.map(g=>({x:g.x,y:g.y,collected:false,t:Math.random()*Math.PI*2}));
  enemies=d.enemies.map(e=>({...e,dead:false,t:Math.random()*Math.PI*2}));
  if(d.bossScaled){boss={...d.bossScaled,dead:false,t:0,invTimer:0,chargeTimer:4,chargeEndTimer:0,charging:false,phase:1};}else boss=null;
  resetPlayer();
}
function resetPlayer(){jumpHeld=false;ridingPlatform=null;player={x:80,y:LEVELS[currentLevel].platforms[0].y-PH,w:PW,h:PH,vx:0,vy:0,onGround:false,jumps:0,maxJumps:2,facing:1,invTimer:0,animFrame:0,animTimer:0,jumping:false};}

/* ── PHYSICS ───────────────────────────────── */
const GRAV=1420,JVEL=-615,SPD=258;
function updatePlatforms(dt){for(const pl of platforms){if(!pl.moving)continue;if(pl.vx){pl.x+=pl.vx*dt;if(pl.x<=pl.minX){pl.x=pl.minX;pl.vx=Math.abs(pl.vx);}if(pl.x+pl.w>=pl.maxX){pl.x=pl.maxX-pl.w;pl.vx=-Math.abs(pl.vx);}}if(pl.vy){pl.y+=pl.vy*dt;if(pl.y<=pl.minY){pl.y=pl.minY;pl.vy=Math.abs(pl.vy);}if(pl.y+pl.h>=pl.maxY){pl.y=pl.maxY-pl.h;pl.vy=-Math.abs(pl.vy);}}}}
function updatePlayer(dt){
  const p=player;if(p.invTimer>0)p.invTimer-=dt;if(powerUpTimer>0)powerUpTimer-=dt;
  if(ridingPlatform&&ridingPlatform.moving){p.x+=ridingPlatform.vx*dt;p.y+=ridingPlatform.vy*dt;}ridingPlatform=null;
  const spd=SPD+currentLevel*3;
  if(goL()){p.vx=-spd;p.facing=-1;}else if(goR()){p.vx=spd;p.facing=1;}else p.vx*=0.55;
  const wj=goJ();
  if(wj&&!jumpHeld&&p.jumps<p.maxJumps){p.vy=JVEL;p.jumps++;jumpHeld=true;p.jumping=true;spawnP(p.x+p.w/2,p.y+p.h,'#80d8ff',7);}
  if(!wj)jumpHeld=false;if(!wj&&p.vy<-220)p.vy+=80;
  p.vy=Math.min(p.vy+GRAV*dt,1100);p.x+=p.vx*dt;
  if(p.x+p.w<0)p.x=GW;if(p.x>GW)p.x=-p.w;
  const prevB=p.y+p.h;p.y+=p.vy*dt;
  if(p.y>GH+120){playerDie();return;}
  p.onGround=false;
  for(const pl of platforms){if(p.x+p.w<pl.x+3||p.x>pl.x+pl.w-3)continue;if(p.vy>=0&&prevB<=pl.y+5&&p.y+p.h>pl.y){p.y=pl.y-p.h;p.vy=0;p.onGround=true;p.jumps=0;p.jumping=false;ridingPlatform=pl;}}
  p.animTimer+=dt;if(p.animTimer>0.1){p.animTimer=0;if(Math.abs(p.vx)>10)p.animFrame=(p.animFrame+1)%4;else p.animFrame=0;}
}
function updateBoss(dt){
  if(!boss||boss.dead)return;
  if(boss.invTimer>0)boss.invTimer-=dt;
  boss.t+=dt*3.5;boss.chargeTimer-=dt;
  if(boss.chargeTimer<=0){boss.chargeTimer=2.5+Math.random()*2.5;boss.charging=true;boss.chargeEndTimer=0.55;}
  if(boss.chargeEndTimer>0){boss.chargeEndTimer-=dt;if(boss.chargeEndTimer<=0)boss.charging=false;}
  if(boss.type==='chaos'||boss.type==='omega'){
    const p2=Math.floor(boss.maxHp*0.6),p3=Math.floor(boss.maxHp*0.3);
    if(boss.hp<=p3&&boss.phase<3){boss.phase=3;spawnP(boss.x+boss.w/2,boss.y+boss.h/2,'#ff1744',35);setMsg(boss.type==='omega'?'OMEGA GOD FINAL PHASE!':'CHAOS GOD ENRAGED!');}
    else if(boss.hp<=p2&&boss.phase<2){boss.phase=2;spawnP(boss.x+boss.w/2,boss.y+boss.h/2,'#ff6d00',22);setMsg('BOSS PHASE 2!');}
  }
  const spd=boss.charging?Math.abs(boss.vx)*(boss.phase===3?3.5:boss.phase===2?2.8:2.2):Math.abs(boss.vx);
  boss.x+=(boss.vx>0?1:-1)*spd*dt;
  if(boss.x<=boss.minX){boss.x=boss.minX;boss.vx=Math.abs(boss.vx);}
  if(boss.x+boss.w>=boss.maxX){boss.x=boss.maxX-boss.w;boss.vx=-Math.abs(boss.vx);}
  if(boss.invTimer>0)return;
  const p=player;
  if(p.x+p.w-4>boss.x&&p.x+4<boss.x+boss.w&&p.y+p.h>boss.y&&p.y<boss.y+boss.h){
    const stomp=p.vy>25&&p.y+p.h<boss.y+boss.h*0.45;
    if(stomp){bossDamage(1);p.vy=JVEL*0.65;}
    else if(powerUpTimer>0){if(flashTimer<=0)setMsg('⚠ BOSS IMMUNE! STOMP IT!');}
    else if(p.invTimer<=0){playerDie();}
  }
}
function bossDamage(amt){
  if(!boss||boss.dead)return;
  boss.hp=Math.max(0,boss.hp-amt);boss.invTimer=1.8;
  spawnP(boss.x+boss.w/2,boss.y+boss.h/2,boss.col,16);score+=100;
  if(boss.hp<=0){boss.dead=true;spawnP(boss.x+boss.w/2,boss.y+boss.h/2,boss.col,55);spawnP(boss.x+boss.w/2,boss.y+boss.h/2,'#ffd700',35);setMsg(`${BOSS_NAMES[boss.type]} DEFEATED!`);score+=800;checkCompletion();}
  else setMsg(`BOSS HIT! ${boss.hp}/${boss.maxHp} HP`);
}
function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.dead){enemies.splice(i,1);continue;}e.x+=e.vx*dt;e.t+=dt*4;if(e.x<=e.minX)e.vx=Math.abs(e.vx);if(e.x+e.w>=e.maxX)e.vx=-Math.abs(e.vx);
    if(player.x+player.w-3>e.x&&player.x+3<e.x+e.w&&player.y+player.h>e.y&&player.y<e.y+e.h){
      if(powerUpTimer>0){e.dead=true;score+=200;spawnP(e.x+e.w/2,e.y+e.h/2,e.col,14);setMsg('CHOMP! +200');}
      else if(player.invTimer<=0){if(player.vy>30&&player.y+player.h<e.y+e.h*0.52){e.dead=true;player.vy=JVEL*0.58;score+=50;spawnP(e.x+e.w/2,e.y+e.h/2,e.col,12);}else{playerDie();return;}}
    }
  }
}
function updateGems(dt){
  for(const g of gems){g.t+=dt*2.5;if(g.collected)continue;const gx=g.x-9,gy=g.y-9+Math.sin(g.t)*3;if(player.x+player.w>gx&&player.x<gx+18&&player.y+player.h>gy&&player.y<gy+18){g.collected=true;score+=10;spawnP(g.x,g.y,g.col,10);}}
  for(const pg of powerGems){pg.t+=dt*2.8;if(pg.collected)continue;const px2=pg.x-15,py2=pg.y-15+Math.sin(pg.t)*4;if(player.x+player.w>px2&&player.x<px2+30&&player.y+player.h>py2&&player.y<py2+30){pg.collected=true;powerUpTimer=12;spawnP(pg.x,pg.y,'#ffd700',28);setMsg('⚡ PAC-MAN POWER! 12s');}}
  checkCompletion();
}
function checkCompletion(){if(gems.every(g=>g.collected)&&(!boss||boss.dead))levelComplete();}
function playerDie(){spawnP(player.x+player.w/2,player.y+player.h/2,'#f5a623',20);lives--;if(lives<=0){state=ST.GAMEOVER;stateTimer=0;goHighlight=bestCheckpointLevel()>=0?0:1;return;}player.invTimer=3;resetPlayer();}
function levelComplete(){
  const bonus=lives*150;score+=bonus;totalScore+=score;coinEarned=(currentLevel+1)*10;coins+=coinEarned;
  if(totalScore>highScore)highScore=totalScore;
  if((currentLevel+1)%2===0){lives=Math.min(lives+1,7);lifeGainBanner=3.5;}
  doSave();stateTimer=0;state=ST.LVLDONE;
  spawnP(GW/2,GH/2,'#ffd700',55);spawnP(GW/4,GH/2,'#39d353',30);spawnP(3*GW/4,GH/2,'#e94560',30);
}
function continueFromCheckpoint(cp){lives=3;score=0;totalScore=0;loadLevel(cp);state=ST.INTRO;stateTimer=0;}
function setMsg(m){flashMsg=m;flashTimer=3;}

/* ── PARTICLES ─────────────────────────────── */
function spawnP(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=70+Math.random()*180,life=0.45+Math.random()*0.55;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-90,life,ml:life,col,sz:2+Math.floor(Math.random()*4)});}}
function updateP(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1);}}

/* ── DRAW HELPERS ──────────────────────────── */
function rnd(v){return Math.round(v);}
function overlay(a,c='0,0,0'){ctx.fillStyle=`rgba(${c},${a})`;ctx.fillRect(0,0,GW,GH);}
function glow(col,b){ctx.shadowColor=col;ctx.shadowBlur=b;}
function noGlow(){ctx.shadowBlur=0;}
function lgrad(x1,y1,x2,y2,...stops){const g=ctx.createLinearGradient(x1,y1,x2,y2);stops.forEach(([t,c])=>g.addColorStop(t,c));return g;}
function rgrad(x,y,r,...stops){const g=ctx.createRadialGradient(x,y,0,x,y,r);stops.forEach(([t,c])=>g.addColorStop(t,c));return g;}
function rrect(x,y,w,h,r,fill,stroke,sw=2){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke();}}
function drawStar(cx,cy,r1,r2,pts,rot=0){ctx.beginPath();for(let i=0;i<pts*2;i++){const a=(i*Math.PI)/pts-Math.PI/2+rot,r=i%2===0?r1:r2;i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}ctx.closePath();}
function adj(hex,f){try{let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);r=Math.min(255,Math.max(0,Math.round(r*f)));g=Math.min(255,Math.max(0,Math.round(g*f)));b=Math.min(255,Math.max(0,Math.round(b*f)));return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;}catch(e){return hex;}}
function hexRGB(hex){return`${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)}`;}

/* ── DRAW BACKGROUND (ANIMATED) ────────────── */
function drawBG(){
  const lv=Math.min(currentLevel,LEVELS.length-1),th=THEMES[LEVELS[lv].tier],t=LEVELS[lv].tier;
  ctx.fillStyle=lgrad(0,0,0,GH,[0,th.sky1],[1,th.sky2]);ctx.fillRect(0,0,GW,GH);

  // Stars
  ctx.fillStyle='rgba(255,255,255,0.35)';
  [[22,10],[72,25],[148,8],[228,22],[318,6],[408,18],[468,32],[52,50],[188,44],[358,38],[432,54],[10,68],[260,14],[130,40],[530,24],[580,50],[300,58],[88,20],[492,11],[170,62],[380,17],[620,30],[700,15],[860,45]].forEach(([sx,sy])=>{const a=0.3+0.4*Math.sin(gameTime*0.8+sx);ctx.globalAlpha=t>=5?a+0.2:a;ctx.fillRect(sx,sy,t>=7?2:1.5,t>=7?2:1.5);});
  ctx.globalAlpha=1;

  // Tier-specific animated elements
  if(t===1){// Forest: fireflies
    for(let i=0;i<16;i++){const fx=GW*0.1+GW*0.8*(0.5+0.5*Math.sin(gameTime*0.25+i*1.3)),fy=80+310*(0.5+0.5*Math.sin(gameTime*0.18+i*0.95)),al=Math.max(0,0.55*Math.sin(gameTime*2.8+i*1.7));ctx.fillStyle=`rgba(180,255,80,${al})`;ctx.beginPath();ctx.arc(fx,fy,2.5,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=0.16;ctx.fillStyle='#1a4010';for(let i=0;i<6;i++){ctx.beginPath();ctx.ellipse(90+i*165,GH-80,165,185,0,0,Math.PI);ctx.fill();}ctx.globalAlpha=1;
  } else if(t===2){// Ice: snowflakes
    ctx.fillStyle='rgba(200,230,255,0.7)';for(let i=0;i<22;i++){const sx=(i*87+gameTime*25)%GW,sy=(i*53+gameTime*40)%GH;ctx.beginPath();ctx.arc(sx,sy,1.5,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=0.14;ctx.fillStyle='#0d1f3a';[[80,60],[245,30],[405,80],[565,20],[725,60],[905,40]].forEach(([px,py])=>{ctx.beginPath();ctx.moveTo(px-125,GH);ctx.lineTo(px,py);ctx.lineTo(px+125,GH);ctx.fill();});ctx.globalAlpha=1;
  } else if(t===3){// Crystal: sparkles
    for(let i=0;i<12;i++){const cx=80+i*75,cy=50+200*(0.5+0.5*Math.sin(gameTime*0.3+i)),al=0.4+0.4*Math.sin(gameTime*4+i*0.8);ctx.fillStyle=`rgba(180,140,255,${al})`;ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=0.16;ctx.fillStyle='#2d0050';for(let i=0;i<8;i++){const cx=60+i*125,h=85+Math.sin(i*1.5)*65;ctx.beginPath();ctx.moveTo(cx-22,GH);ctx.lineTo(cx-9,GH-h);ctx.lineTo(cx,GH-h-22);ctx.lineTo(cx+9,GH-h);ctx.lineTo(cx+22,GH);ctx.fill();}ctx.globalAlpha=1;
  } else if(t===4){// Lava: rising embers
    for(let i=0;i<18;i++){const ex=(i*57+gameTime*15)%GW,ey=GH-((i*41+gameTime*60)%(GH*0.7)),al=0.5+0.3*Math.sin(gameTime*3+i);ctx.fillStyle=`rgba(255,${80+Math.floor(60*Math.sin(gameTime+i))},0,${al})`;ctx.beginPath();ctx.arc(ex,ey,1.5+Math.sin(gameTime+i),0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=0.12;ctx.fillStyle='#1a0500';[[165,GH],[490,GH],[815,GH]].forEach(([vx,vy])=>{ctx.beginPath();ctx.moveTo(vx-135,vy);ctx.lineTo(vx,vy-210);ctx.lineTo(vx+135,vy);ctx.fill();});
    ctx.globalAlpha=0.1;ctx.fillStyle=`rgba(255,80,0,${0.1+0.05*Math.sin(gameTime*2)})`;ctx.fillRect(0,GH-30,GW,30);ctx.globalAlpha=1;
  } else if(t===5){// Space: shooting stars
    for(let i=0;i<5;i++){const prog=(gameTime*0.06+i*0.2)%1,sx=GW*prog,sy=50+80*i;ctx.strokeStyle=`rgba(255,255,255,${0.7*(1-prog)})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-35,sy+18);ctx.stroke();}
    ctx.globalAlpha=0.1;ctx.fillStyle=rgrad(830,120,105,[0,'#4a1080'],[1,'transparent']);ctx.beginPath();ctx.arc(830,120,105,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  } else if(t===6){// Ghost: wisps
    for(let i=0;i<10;i++){const wx=80+i*85+Math.sin(gameTime*0.4+i)*40,wy=60+200*Math.sin(gameTime*0.25+i*0.7),al=0.15+0.12*Math.sin(gameTime*1.5+i);ctx.fillStyle=`rgba(70,200,220,${al})`;ctx.beginPath();ctx.ellipse(wx,wy,12,20,gameTime*0.3+i,0,Math.PI*2);ctx.fill();}
  } else if(t===7){// Storm: rain + lightning
    ctx.strokeStyle='rgba(180,220,255,0.12)';ctx.lineWidth=1;for(let i=0;i<30;i++){const rx=(i*47+gameTime*180)%GW,ry=(i*31+gameTime*250)%GH;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx+10,ry+18);ctx.stroke();}
    if(Math.sin(gameTime*2.5)>0.9){const lx=100+Math.random()*760;ctx.strokeStyle='rgba(150,200,255,0.4)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx+20,GH*0.5);ctx.lineTo(lx-10,GH);ctx.stroke();}

    for(let i=0;i<20;i++){const ang=gameTime*1.2+i/20*Math.PI*2,r=200+100*Math.sin(gameTime*0.4+i),px=GW/2+Math.cos(ang)*r,py=GH/2+Math.sin(ang)*r*0.55,al=0.08+0.05*Math.sin(gameTime*2+i);ctx.fillStyle=`hsla(${(gameTime*60+i*18)%360},100%,60%,${al})`;ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();}

    for(let i=0;i<20;i++){const fx=(i*59+gameTime*20)%GW,fy=GH-((i*43+gameTime*80)%(GH*0.6)),al=0.45+0.3*Math.sin(gameTime*4+i);ctx.fillStyle=`rgba(255,${120+Math.floor(80*Math.sin(gameTime*2+i))},0,${al})`;ctx.beginPath();ctx.arc(fx,fy,2+Math.sin(gameTime*2+i),0,Math.PI*2);ctx.fill();}
    for(let i=0;i<8;i++){const cx=80+i*115,cy=GH-80,al=0.1+0.08*Math.sin(gameTime*3+i);ctx.fillStyle=`rgba(255,150,0,${al})`;ctx.beginPath();ctx.ellipse(cx,cy,20,40,0,Math.PI,0);ctx.fill();}
  } else if(t===10){// Omega: divine gold particles
    for(let i=0;i<25;i++){const ang=gameTime*0.6+i/25*Math.PI*2,r=80+150*Math.abs(Math.sin(gameTime*0.2+i*0.4)),px=GW/2+Math.cos(ang)*r,py=GH/2+Math.sin(ang)*r*0.45;const al=0.12+0.1*Math.sin(gameTime*3+i);ctx.fillStyle=`rgba(255,215,0,${al})`;ctx.fillRect(rnd(px),rnd(py),3,3);}
    glow('#ffd700',20);ctx.fillStyle='rgba(255,215,0,0.04)';ctx.fillRect(0,0,GW,GH);noGlow();
  }

  // Wrap indicators
  ctx.fillStyle=lgrad(0,0,8,0,[0,'rgba(255,255,100,0.1)'],[1,'transparent']);ctx.fillRect(0,0,8,GH);
  ctx.fillStyle=lgrad(GW-8,0,GW,0,[0,'transparent'],[1,'rgba(255,255,100,0.1)']);ctx.fillRect(GW-8,0,8,GH);
}

/* ── PLATFORM ──────────────────────────────── */
function drawPlatform(pl){
  const x=rnd(pl.x),y=rnd(pl.y),w=pl.w,h=pl.h;
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(x+4,y+5,w,h);
  ctx.fillStyle=lgrad(x,y,x,y+h,[0,pl.col],[0.5,adj(pl.col,1.1)],[1,adj(pl.col,0.8)]);ctx.fillRect(x,y+7,w,h-7);
  ctx.fillStyle=lgrad(x,y,x,y+9,[0,adj(pl.top,1.25)],[1,pl.top]);ctx.fillRect(x,y,w,8);
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x+2,y+1,w-4,2);
  ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=1;for(let i=20;i<w-4;i+=24){ctx.beginPath();ctx.moveTo(x+i,y+9);ctx.lineTo(x+i,y+h);ctx.stroke();}
  ctx.fillStyle='rgba(255,255,255,0.07)';ctx.fillRect(x,y,2,h);
  if(pl.moving){const p=0.12+0.08*Math.sin(gameTime*4);glow(pl.top,14);ctx.strokeStyle=`rgba(255,255,255,${p*2})`;ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);noGlow();}
}

/* ── GEM ───────────────────────────────────── */
function drawGem(g){
  if(g.collected)return;
  const s=17,bx=rnd(g.x-s/2),by=rnd(g.y-s/2+Math.sin(g.t)*3.5);
  glow(g.col,18);ctx.fillStyle=g.col;ctx.beginPath();ctx.moveTo(bx+s/2,by);ctx.lineTo(bx+s,by+s/2);ctx.lineTo(bx+s/2,by+s);ctx.lineTo(bx,by+s/2);ctx.closePath();ctx.fill();noGlow();
  ctx.fillStyle='rgba(255,255,255,0.65)';ctx.beginPath();ctx.moveTo(bx+s/2,by+1);ctx.lineTo(bx+s-2,by+s/2);ctx.lineTo(bx+s/2,by+5);ctx.closePath();ctx.fill();
}

/* ── POWER GEM ─────────────────────────────── */
function drawPowerGem(pg){
  if(pg.collected)return;
  const pulse=1+0.2*Math.sin(pg.t*3),cx=rnd(pg.x),cy=rnd(pg.y+Math.sin(pg.t)*4);
  ctx.globalAlpha=0.15+0.1*Math.sin(pg.t*4);ctx.fillStyle=rgrad(cx,cy,24*pulse,[0,'#ffd700'],[1,'transparent']);ctx.beginPath();ctx.arc(cx,cy,24*pulse,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  glow('#ffd700',22);ctx.strokeStyle='rgba(255,215,0,0.5)';ctx.lineWidth=1.5;
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2+gameTime;ctx.beginPath();ctx.moveTo(cx+8*Math.cos(a),cy+8*Math.sin(a));ctx.lineTo(cx+20*pulse*Math.cos(a),cy+20*pulse*Math.sin(a));ctx.stroke();}
  ctx.fillStyle=lgrad(cx-14,cy-14,cx+14,cy+14,[0,'#fff9c4'],[0.5,'#ffd700'],[1,'#f57f17']);
  drawStar(cx,cy,14*pulse,6*pulse,5,gameTime*0.5);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.85)';drawStar(cx,cy,7*pulse,3*pulse,5,gameTime*0.5);ctx.fill();noGlow();
  ctx.textAlign='center';ctx.font='6px "Press Start 2P"';ctx.fillStyle='rgba(255,215,0,0.9)';ctx.fillText('POWER',cx,cy-20);ctx.textAlign='left';
}

/* ── ENEMY ─────────────────────────────────── */
function drawEnemy(e){
  if(e.dead)return;
  const pw=powerUpTimer>0,fl=pw&&Math.floor(gameTime*8)%2===0;
  const ec=pw?(fl?'#80d8ff':'#4fc3f7'):e.col;
  const ew=e.w,eh=e.h,b=Math.sin(e.t)*2,ex=rnd(e.x),ey=rnd(e.y+b),t=getTier(currentLevel+1);
  glow(ec,pw?14:5);
  if(t<=2){ctx.fillStyle=lgrad(ex,ey,ex,ey+eh,[0,adj(ec,1.3)],[1,adj(ec,0.7)]);ctx.beginPath();ctx.ellipse(ex+ew/2,ey+eh*0.55,ew*0.5,eh*0.5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex+ew*0.3,ey+eh*0.35,ew*0.12,ew*0.14,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(ex+ew*0.7,ey+eh*0.35,ew*0.12,ew*0.14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ex+ew*0.31+(e.vx>0?2:0),ey+eh*0.36,ew*0.06,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ex+ew*0.71+(e.vx>0?2:0),ey+eh*0.36,ew*0.06,0,Math.PI*2);ctx.fill();}
  else if(t<=4){ctx.fillStyle=lgrad(ex,ey,ex+ew,ey+eh,[0,adj(ec,1.2)],[1,ec]);rrect(ex+2,ey+3,ew-4,eh-3,4,ctx.fillStyle);rrect(ex+4,ey,ew-8,8,3,adj(ec,1.4));ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(ex+4,ey,4,3);ctx.fillStyle='#fff';rrect(ex+4,ey+4,6,6,2,ctx.fillStyle);rrect(ex+ew-10,ey+4,6,6,2,ctx.fillStyle);ctx.fillStyle='#222';ctx.fillRect(ex+6,ey+6,3,3);ctx.fillRect(ex+ew-8,ey+6,3,3);}
  else if(t<=7){const wf=Math.sin(e.t*2.5)*12;ctx.fillStyle=`rgba(${hexRGB(ec)},0.8)`;ctx.beginPath();ctx.moveTo(ex+ew/2,ey+eh*0.5);ctx.quadraticCurveTo(ex-8,ey+wf,ex-ew*0.3,ey+eh*0.3);ctx.quadraticCurveTo(ex,ey-4,ex+ew/2,ey+eh*0.5);ctx.fill();ctx.beginPath();ctx.moveTo(ex+ew/2,ey+eh*0.5);ctx.quadraticCurveTo(ex+ew+8,ey+wf,ex+ew*1.3,ey+eh*0.3);ctx.quadraticCurveTo(ex+ew,ey-4,ex+ew/2,ey+eh*0.5);ctx.fill();ctx.fillStyle=lgrad(ex+ew*0.2,ey,ex+ew*0.8,ey+eh,[0,adj(ec,1.2)],[1,ec]);ctx.beginPath();ctx.ellipse(ex+ew/2,ey+eh*0.55,ew*0.35,eh*0.45,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff1744';ctx.beginPath();ctx.arc(ex+ew*0.35,ey+eh*0.45,ew*0.1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ex+ew*0.65,ey+eh*0.45,ew*0.1,0,Math.PI*2);ctx.fill();}
  else{const hv=Math.sin(e.t*2)*2;ctx.fillStyle=lgrad(ex,ey+hv,ex+ew,ey+eh+hv,[0,'#1a2535'],[1,'#0d1820']);rrect(ex+2,ey+2+hv,ew-4,eh-4,5,ctx.fillStyle);ctx.fillStyle=rgrad(ex+ew/2,ey+eh/2+hv,ew*0.28,[0,adj(ec,1.8)],[1,ec]);ctx.beginPath();ctx.arc(ex+ew/2,ey+eh/2+hv,ew*0.25,0,Math.PI*2);ctx.fill();}
  noGlow();
  if(pw){ctx.strokeStyle=`rgba(128,216,255,${0.5+0.3*Math.sin(gameTime*10)})`;ctx.lineWidth=2;ctx.strokeRect(ex-2,ey-2+b,ew+4,eh+4);}
}

/* ── BOSS ──────────────────────────────────── */
function drawBoss(b){
  if(!b||b.dead)return;
  const flash=b.invTimer>0&&Math.floor(b.invTimer*10)%2===0;
  if(flash)ctx.globalAlpha=0.4;
  const bx=rnd(b.x),by=rnd(b.y),bw=b.w,bh=b.h;
  const pw=powerUpTimer>0,bc=pw?'#80d8ff':b.col,phase=b.phase||1;

  if(b.type==='slime'){
    glow(bc,20);ctx.fillStyle=lgrad(bx,by,bx,by+bh,[0,adj(bc,1.3)],[1,adj(bc,0.65)]);ctx.beginPath();ctx.ellipse(bx+bw/2,by+bh*0.6,bw*0.52,bh*0.52,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffd700';glow('#ffd700',12);[bx+bw*0.2,bx+bw*0.5,bx+bw*0.8].forEach((cx,i)=>{ctx.beginPath();ctx.moveTo(cx,by+12);ctx.lineTo(cx,by);ctx.lineTo(cx+bw*0.15,by+8+(i===1?-10:0));ctx.lineTo(cx+bw*0.28,by);ctx.lineTo(cx+bw*0.28,by+12);ctx.fill();});noGlow();
    glow('#fff',10);ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(bx+bw*0.3,by+bh*0.42,bw*0.1,bh*0.12,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(bx+bw*0.7,by+bh*0.42,bw*0.1,bh*0.12,0,0,Math.PI*2);ctx.fill();noGlow();

  if(d.bossRaw){glow('#e94560',12);txt(`⚔ BOSS: ${BOSS_NAMES[d.bossRaw.type]}  (${d.bossRaw.hp} HP)`,GW/2,GH/2-28,'7px "Press Start 2P"','#ff6d6d',C);noGlow();txt('STOMP BOSS + COLLECT ALL GEMS!',GW/2,GH/2-8,'6px "Press Start 2P"','#ff9a9a',C);}
  glow('#ffd700',8);txt('★ 2 POWER STARS HIDDEN! ★',GW/2,GH/2+16,'6px "Press Start 2P"','#ffd700',C);noGlow();
  if(d.hint){const hCol=[4,9,14].includes(currentLevel)?'#39d353':currentLevel===19?'#e94560':'#f5a623';txt(d.hint,GW/2,GH/2+38,'7px "Press Start 2P"',hCol,C);}
  if(Math.sin(gameTime*4)>0){glow('#39d353',8);txt('PRESS ANY KEY TO START!',GW/2,GH/2+88,'8px "Press Start 2P"','#39d353',C);noGlow();}
  ctx.textAlign='left';
}

function drawLevelDone(){
  drawBG();for(const pl of platforms)drawPlatform(pl);for(const g of gems)drawGem(g);updateP(0);drawParts();overlay(0.52);
  card(GW/2-265,GH/2-145,530,290,'#39d353',true);
  glow('#39d353',18);txt('LEVEL CLEAR!',GW/2,GH/2-100,'19px "Press Start 2P"','#39d353',C);noGlow();
  txt(`LEVEL ${currentLevel+1} COMPLETE`,GW/2,GH/2-70,'9px "Press Start 2P"','#f5a623',C);
  txt(`BONUS: +${lives*150}pts`,GW/2,GH/2-42,'6px "Press Start 2P"','#fff',C);
  glow('#4fc3f7',8);txt(`TOTAL: ${totalScore}`,GW/2,GH/2-16,'9px "Press Start 2P"','#4fc3f7',C);noGlow();
  const cp=Math.sin(gameTime*6)>0;glow('#ffd700',cp?10:0);txt(`🪙 +${coinEarned} COINS! (Total: ${coins})`,GW/2,GH/2+12,'8px "Press Start 2P"',cp?'#ffd700':'#c8a000',C);noGlow();
  if(lifeGainBanner>0){glow('#ff69b4',12);txt('❤ +1 EXTRA LIFE!',GW/2,GH/2+38,'8px "Press Start 2P"','#ff69b4',C);noGlow();}
  else txt('SHOP FOR SKINS [S]',GW/2,GH/2+38,'6px "Press Start 2P"','#666',C);
  if(Math.sin(gameTime*4)>0){const nxt=currentLevel+1;glow('#39d353',8);txt(nxt<LEVELS.length?`ANY KEY → LEVEL ${nxt+1}`:'ANY KEY → FINAL RESULTS!',GW/2,GH/2+78,'8px "Press Start 2P"','#39d353',C);noGlow();}
  ctx.textAlign='left';
}

function drawGameOver(){
  drawBG();for(const pl of platforms)drawPlatform(pl);overlay(0.75);
  const cpLvl=bestCheckpointLevel();
  card(GW/2-260,GH/2-140,520,cpLvl>=0?300:240,'#e94560',true);
  glow('#e94560',20);txt('GAME OVER',GW/2,GH/2-96,'22px "Press Start 2P"','#e94560',C);noGlow();
  txt(`REACHED LEVEL ${currentLevel+1}`,GW/2,GH/2-64,'8px "Press Start 2P"','#fff',C);
  glow('#f5a623',8);txt(`SCORE: ${totalScore}`,GW/2,GH/2-38,'10px "Press Start 2P"','#f5a623',C);noGlow();
  if(totalScore>=highScore&&totalScore>0){glow('#ffd700',10);txt('★ NEW HIGH SCORE! ★',GW/2,GH/2-10,'8px "Press Start 2P"','#ffd700',C);noGlow();}
  if(cpLvl>=0){
    const cpName=cpLvl===14?'LVL 15':cpLvl===9?'LVL 10':'LVL 5';
    const c0=goHighlight===0,c1=goHighlight===1;
    ctx.fillStyle=c0?'rgba(57,211,83,0.22)':'rgba(57,211,83,0.07)';rrect(GW/2-238,GH/2+16,225,42,8,ctx.fillStyle);
    if(c0)glow('#39d353',10);ctx.strokeStyle=c0?'#39d353':'#224422';ctx.lineWidth=2;rrect(GW/2-238,GH/2+16,225,42,8,null,ctx.strokeStyle,2);if(c0)noGlow();
    txt(`↑ CHECKPOINT ${cpName}`,GW/2-126,GH/2+43,'7px "Press Start 2P"',c0?'#39d353':'#558855',C);
    ctx.fillStyle=c1?'rgba(233,69,96,0.22)':'rgba(233,69,96,0.07)';rrect(GW/2+12,GH/2+16,225,42,8,ctx.fillStyle);
    if(c1)glow('#e94560',10);ctx.strokeStyle=c1?'#e94560':'#442222';ctx.lineWidth=2;rrect(GW/2+12,GH/2+16,225,42,8,null,ctx.strokeStyle,2);if(c1)noGlow();
    txt('MAIN MENU',GW/2+126,GH/2+43,'7px "Press Start 2P"',c1?'#e94560':'#885555',C);
    txt('← → CHOOSE   ENTER CONFIRM',GW/2,GH/2+76,'6px "Press Start 2P"','#555577',C);
    txt(`Checkpoints: ${checkpointLevel>=5?'LVL5 ✓':'LVL5'} ${checkpointLevel>=10?'LVL10 ✓':'LVL10'} ${checkpointLevel>=15?'LVL15 ✓':'LVL15'}`,GW/2,GH/2+102,'5px "Press Start 2P"','#556',C);
  } else if(Math.sin(gameTime*3.5)>0){txt('PRESS ANY KEY TO TRY AGAIN',GW/2,GH/2+50,'7px "Press Start 2P"','#4fc3f7',C);}
  ctx.textAlign='left';
}

function drawPause(){
  drawBG();for(const pl of platforms)drawPlatform(pl);for(const g of gems)drawGem(g);for(const pg of powerGems)drawPowerGem(pg);for(const e of enemies)drawEnemy(e);if(boss)drawBoss(boss);drawParts();drawPlayer();drawHUD();
  overlay(0.7);
  card(GW/2-210,GH/2-120,420,240,'#4fc3f7',true);
  glow('#fff',12);txt('⏸ PAUSED',GW/2,GH/2-68,'20px "Press Start 2P"','#fff',C);noGlow();
  txt(`LEVEL ${currentLevel+1}/20 — ${LEVELS[currentLevel].name}`,GW/2,GH/2-36,'6px "Press Start 2P"',THEMES[LEVELS[currentLevel].tier].hud,C);
  txt(`SCORE: ${score}   LIVES: ${lives}   COINS: ${coins}`,GW/2,GH/2-12,'6px "Press Start 2P"','#aaa',C);
  glow('#39d353',8);txt('[P] RESUME GAME',GW/2,GH/2+20,'9px "Press Start 2P"','#39d353',C);noGlow();
  txt('[ESC] BACK TO MENU',GW/2,GH/2+52,'7px "Press Start 2P"','#e94560',C);
  txt('[F] FULLSCREEN  ·  WASD/ARROWS = MOVE  ·  SPACE = JUMP',GW/2,GH/2+80,'5px "Press Start 2P"','#444',C);
  ctx.textAlign='left';
}

function drawWin(){
  const sv=currentLevel;currentLevel=19;drawBG();currentLevel=sv;updateP(0);drawParts();
  [[100,110],[870,120],[220,310],[740,290],[490,80],[150,260],[810,230],[490,300]].forEach(([bx,by],bi)=>{const cs=['#f5a623','#39d353','#4fc3f7','#e94560','#b39ddb','#fff','#ffd700','#ff70b0'];for(let i=0;i<14;i++){const a=(i/14)*Math.PI*2+gameTime*1.5+bi,rv=24+Math.sin(gameTime*3+i+bi)*10;glow(cs[(i+bi)%cs.length],8);ctx.fillStyle=cs[(i+bi)%cs.length];ctx.fillRect(rnd(bx+Math.cos(a)*rv),rnd(by+Math.sin(a)*rv),3,3);}});noGlow();overlay(0.42);
  card(GW/2-265,GH/2-160,530,320,'#ffd700',true);
  glow('#ffd700',22);txt('YOU WIN!',GW/2,GH/2-112,'26px "Press Start 2P"','#ffd700',C);noGlow();
  glow('#e94560',12);txt('ALL 20 LEVELS & BOSSES DEFEATED!',GW/2,GH/2-78,'7px "Press Start 2P"','#e94560',C);noGlow();
  glow('#f5a623',8);txt(`FINAL SCORE: ${totalScore}`,GW/2,GH/2-48,'11px "Press Start 2P"','#fff',C);noGlow();
  if(totalScore>=highScore&&totalScore>0){glow('#ffd700',12);txt('★ NEW HIGH SCORE! ★',GW/2,GH/2-18,'9px "Press Start 2P"','#ffd700',C);noGlow();}
  txt(`COINS: ${coins} 🪙   THE OMEGA GOD IS DEFEATED!`,GW/2,GH/2+12,'6px "Press Start 2P"','#f5a623',C);
  if(Math.sin(gameTime*3)>0){glow('#39d353',8);txt('PRESS ANY KEY TO PLAY AGAIN',GW/2,GH/2+90,'8px "Press Start 2P"','#f5a623',C);noGlow();}
  ctx.textAlign='left';
}

/* ── SHOP ──────────────────────────────────── */
function shopPos(i){const CW=205,CH=138,gap=8,perRow=4,row=Math.floor(i/perRow),col=i%perRow,ry=68+row*(CH+gap);if(row===2){const sx=Math.round((GW-(3*CW+2*gap))/2);return{x:sx+col*(CW+gap),y:ry,w:CW,h:CH};}const sx=Math.round((GW-(perRow*CW+(perRow-1)*gap))/2);return{x:sx+col*(CW+gap),y:ry,w:CW,h:CH};}
function drawShop(){
  overlay(1);glow('#f5a623',18);txt('SKIN SHOP',GW/2,36,'14px "Press Start 2P"','#f5a623',C);noGlow();txt(`COINS: ${coins} 🪙`,GW/2,56,'7px "Press Start 2P"','#ffd700',C);
  txt('[←→↑↓] BROWSE   [ENTER] BUY/EQUIP   [ESC/B] BACK',GW/2,530,'5px "Press Start 2P"','#333355',C);
  SKINS.forEach((sk,i)=>{const{x,y,w,h}=shopPos(i),sel=shopCursor===i,owned=unlockedSkins.has(i),equipped=selectedSkin===i;ctx.fillStyle=sel?'rgba(79,195,247,0.14)':equipped?'rgba(255,215,0,0.07)':'rgba(255,255,255,0.04)';rrect(x,y,w,h,10,ctx.fillStyle);if(sel)glow('#4fc3f7',14);ctx.strokeStyle=sel?'#4fc3f7':equipped?'#ffd700':owned?'#39d353':'#222244';ctx.lineWidth=sel||equipped?2.5:1.5;rrect(x,y,w,h,10,null,ctx.strokeStyle,ctx.lineWidth);if(sel)noGlow();drawMiniChar(x+w/2,y+56,i);txt(sk.name,x+w/2,y+92,'6px "Press Start 2P"',sel?'#4fc3f7':equipped?'#ffd700':'#fff',C);if(equipped){glow('#ffd700',8);txt('✓ EQUIPPED',x+w/2,y+110,'5px "Press Start 2P"','#ffd700',C);noGlow();}else if(owned){txt('OWNED',x+w/2,y+108,'5px "Press Start 2P"','#39d353',C);txt('TAP TO EQUIP',x+w/2,y+122,'4px "Press Start 2P"','#2a8a4a',C);}else{const can=coins>=sk.price;if(can)glow('#f5a623',5);txt(`${sk.price}🪙`,x+w/2,y+108,'6px "Press Start 2P"',can?'#f5a623':'#664444',C);noGlow();if(!can)txt(`NEED ${sk.price-coins} MORE`,x+w/2,y+124,'4px "Press Start 2P"','#552222',C);}});ctx.textAlign='left';
}
function shopAction(){const sk=SKINS[shopCursor];if(unlockedSkins.has(shopCursor)){selectedSkin=shopCursor;doSave();}else if(coins>=sk.price){coins-=sk.price;unlockedSkins.add(shopCursor);selectedSkin=shopCursor;doSave();setMsg(`${sk.name} UNLOCKED!`);}}

/* ── INPUT ROUTING ─────────────────────────── */
function onKey(code){
  // Pause toggle (works during play or when paused)
  if(code==='KeyP'){if(state===ST.PLAYING){state=ST.PAUSED;return;}if(state===ST.PAUSED){state=ST.PLAYING;return;}}
  if(state===ST.PAUSED){if(code==='Escape'){state=ST.MENU;}return;}
  if(state===ST.PLAYING)return;
  if(state===ST.SHOP){const N=SKINS.length;if(code==='ArrowLeft'||code==='KeyA')shopCursor=Math.max(0,shopCursor-1);else if(code==='ArrowRight'||code==='KeyD')shopCursor=Math.min(N-1,shopCursor+1);else if(code==='ArrowUp'||code==='KeyW')shopCursor=Math.max(0,shopCursor-4);else if(code==='ArrowDown'||code==='KeyS')shopCursor=Math.min(N-1,shopCursor+4);else if(code==='Enter'||code==='Space')shopAction();else if(code==='Escape'||code==='KeyB')state=ST.MENU;return;}
  if(state===ST.GAMEOVER){const cpLvl=bestCheckpointLevel();if(cpLvl<0||stateTimer<0.9){if(stateTimer>1.5)state=ST.MENU;return;}if(code==='ArrowLeft'||code==='KeyA')goHighlight=0;else if(code==='ArrowRight'||code==='KeyD')goHighlight=1;else if(code==='Enter'||code==='Space'){if(goHighlight===0&&cpLvl>=0)continueFromCheckpoint(cpLvl);else state=ST.MENU;}else if(code==='Escape'||code==='KeyM')state=ST.MENU;return;}
  if(state===ST.LVLDONE&&code==='KeyS'){state=ST.SHOP;return;}
  if(state===ST.MENU){if(code==='KeyS'){state=ST.SHOP;return;}currentLevel=0;score=0;totalScore=0;lives=3;loadLevel(0);state=ST.INTRO;stateTimer=0;return;}
  if(state===ST.INTRO){state=ST.PLAYING;return;}
  if(state===ST.LVLDONE){const nxt=currentLevel+1;if(nxt>=LEVELS.length){state=ST.WIN;stateTimer=0;}else{score=0;loadLevel(nxt);state=ST.INTRO;stateTimer=0;}return;}
  if(state===ST.WIN){state=ST.MENU;return;}
}
function onCanvasClick(cx,cy){
  if(state===ST.PAUSED){if(cy>GH/2+4&&cy<GH/2+40)state=ST.PLAYING;else if(cy>GH/2+36&&cy<GH/2+70)state=ST.MENU;return;}
  if(state===ST.MENU){if(cx>GW/2-90&&cx<GW/2+90&&cy>260&&cy<292){state=ST.SHOP;return;}onKey('Enter');}
  else if(state===ST.SHOP){SKINS.forEach((_,i)=>{const{x,y,w,h}=shopPos(i);if(cx>=x&&cx<=x+w&&cy>=y&&cy<=y+h){shopCursor=i;shopAction();}});}
  else if(state===ST.GAMEOVER){const cpLvl=bestCheckpointLevel();if(cpLvl>=0&&stateTimer>0.9){if(cx>GW/2-238&&cx<GW/2-13&&cy>GH/2+16&&cy<GH/2+58)continueFromCheckpoint(cpLvl);else if(cx>GW/2+12&&cx<GW/2+237&&cy>GH/2+16&&cy<GH/2+58)state=ST.MENU;}}
  else onKey('Enter');
}

/* ── MAIN LOOP ─────────────────────────────── */
let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/1000,0.05);last=ts;gameTime+=dt;stateTimer+=dt;
  if(flashTimer>0)flashTimer-=dt;if(cpBanner>0)cpBanner-=dt;if(lifeGainBanner>0)lifeGainBanner-=dt;
  ctx.clearRect(0,0,GW,GH);

  if(state===ST.MENU)drawMenu();
  else if(state===ST.INTRO){drawIntro();if(stateTimer>5)state=ST.PLAYING;}
  else if(state===ST.PLAYING){
    updatePlatforms(dt);updatePlayer(dt);
    if(state===ST.PLAYING){updateBoss(dt);updateEnemies(dt);updateGems(dt);updateP(dt);}
    drawBG();for(const pl of platforms)drawPlatform(pl);for(const g of gems)drawGem(g);for(const pg of powerGems)drawPowerGem(pg);for(const e of enemies)drawEnemy(e);if(boss)drawBoss(boss);drawParts();drawPlayer();drawHUD();
  }
  else if(state===ST.PAUSED){drawPause();}
  else if(state===ST.LVLDONE){updateP(dt);drawLevelDone();}
  else if(state===ST.GAMEOVER)drawGameOver();
  else if(state===ST.WIN){updateP(dt);drawWin();}
  else if(state===ST.SHOP)drawShop();

  requestAnimationFrame(loop);
}

currentLevel=0;loadLevel(0);state=ST.MENU;
requestAnimationFrame(loop);
</script>
